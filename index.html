<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RutaExpress Admin</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6FA;--card:#FFFFFF;--border:#E6EAF1;--accent:#2563EB;--accentDark:#1E40AF;
    --green:#16A34A;--red:#DC2626;--orange:#EA7A00;--amber:#D97706;--violet:#7C3AED;
    --t1:#0F172A;--t2:#5B6B82;--t3:#94A3B8;--muted:#EEF2F7;
    --side:#0B1220;--sideHover:#151F33;
    --sh1:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04);
    --sh2:0 10px 30px rgba(15,23,42,.12);
    --r:16px;--ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--t1);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  h1,h2,h3,p{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  input{font-family:inherit}
  img{display:block}
  .hidden{display:none!important}
  svg.lucide{width:18px;height:18px;stroke-width:2;flex-shrink:0}

  /* Animaciones */
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes shimmer{to{background-position:-200% 0}}
  .in{animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* Login */
  #login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
  .loginArt{position:relative;background:url(assets/mapa-bg.jpg) center/cover;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .loginArt::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(244,246,250,.6))}
  .loginRadar{position:relative;width:360px;height:360px;z-index:1}
  .loginRadar img{position:absolute;left:130px;top:130px;width:100px;height:100px;border-radius:50%;box-shadow:0 8px 24px rgba(37,99,235,.35);background:#fff}
  .loginForm{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,96px);gap:14px;background:var(--card)}
  .loginForm h1{font-size:30px;font-weight:900;letter-spacing:-.6px}
  .loginForm .sub{color:var(--t2);margin-bottom:10px}
  .field{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:14px;padding:0 14px;height:52px;background:var(--bg);transition:border-color .2s}
  .field:focus-within{border-color:var(--accent);background:#fff}
  .field input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--t1)}
  .field svg{color:var(--t3)}
  .hint{font-size:12px;color:var(--t3)}
  @media(max-width:860px){#login{grid-template-columns:1fr}.loginArt{height:300px}.loginRadar{transform:scale(.75)}}

  /* Botones */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;transition:transform .15s var(--ease),box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
  a.btn{text-decoration:none}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .btn.pri{background:linear-gradient(135deg,#4F8DF7,var(--accent) 55%,var(--accentDark));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3)}
  .btn.pri:hover{box-shadow:0 8px 22px rgba(37,99,235,.4)}
  .btn.ok{background:linear-gradient(135deg,#4ADE80,#22C55E 55%,var(--green));color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.28)}
  .btn.soft{background:#fff;border:1px solid var(--border);color:var(--t1);box-shadow:var(--sh1)}
  .btn.soft:hover{border-color:#CBD5E1}
  .btn.warn{background:linear-gradient(180deg,#FFFFFF,#FFF7ED 55%,#FFEDD5);border:1.2px solid #FDBA74;color:#C2410C;box-shadow:0 4px 12px rgba(234,122,0,.16)}
  .btn.warn:hover{box-shadow:0 6px 18px rgba(234,122,0,.26)}
  .btn.danger{background:linear-gradient(180deg,#FFFFFF,#FFF5F5 55%,#FEE2E2);border:1.2px solid #FCA5A5;color:var(--red);box-shadow:0 4px 12px rgba(220,38,38,.14)}
  .btn.danger:hover{box-shadow:0 6px 18px rgba(220,38,38,.24)}
  .btn.solidRed{background:linear-gradient(135deg,#F87171,#EF4444 55%,var(--red));color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.3)}
  .btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
  .btn.full{width:100%}
  .link{color:var(--accent);font-weight:700;font-size:13px}
  .link:hover{text-decoration:underline}

  /* Layout */
  .layout{display:flex;min-height:100vh}
  .side{width:244px;background:var(--side);color:#CBD5E1;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .3s var(--ease)}
  .brand{display:flex;align-items:center;gap:10px;padding:22px 18px 18px}
  .brand img{width:38px;height:38px;border-radius:11px}
  .brand b{display:block;color:#fff;font-size:16px;font-weight:800}
  .brand span{font-size:11px;color:#64748B}
  .nav{flex:1;padding:4px 10px;display:flex;flex-direction:column;gap:2px}
  .navItem{position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:11px;color:#94A3B8;font-weight:600;transition:background .2s,color .2s}
  .navItem:hover{background:var(--sideHover);color:#fff}
  .navItem.active{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
  .navBadge{margin-left:auto;background:var(--orange);color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .navItem.active .navBadge{background:#fff;color:var(--accent)}
  .sideFoot{display:flex;align-items:center;gap:10px;padding:16px;border-top:1px solid #1E293B}
  .sideFoot .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .sideFoot b{display:block;color:#fff;font-size:13px}
  .sideFoot span{font-size:11px;color:#64748B}
  .sideFoot button{margin-left:auto;color:#94A3B8;padding:8px;border-radius:10px}
  .sideFoot button:hover{background:var(--sideHover);color:#fff}
  .main{flex:1;margin-left:244px;min-width:0}
  .top{display:flex;align-items:center;gap:12px;padding:22px 28px 6px}
  .top h2{font-size:22px;font-weight:900;letter-spacing:-.4px}
  .top .sub{font-size:13px;color:var(--t2);margin-top:2px}
  .top .sp{flex:1}
  .hamb{display:none;width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--border);align-items:center;justify-content:center}
  .content{padding:16px 28px 56px;display:flex;flex-direction:column;gap:18px}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  @media(max-width:900px){
    .side{transform:translateX(-100%)}.side.open{transform:none}
    .main{margin-left:0}.hamb{display:flex}
    .content{padding:14px 16px 48px}.top{padding:16px 16px 4px}
    .top .btn span,.top .sub{display:none}
  }

  /* Tarjetas */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh1)}
  .pad{padding:18px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .head h3{font-size:15px;font-weight:800}
  .muted{color:var(--t2);font-size:12.5px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
  .grid4>*,.grid2>*{min-width:0}
  @media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
  @media(max-width:520px){.grid4{grid-template-columns:1fr 1fr;gap:10px}}

  .kpi{display:flex;gap:14px;align-items:flex-start;padding:18px;transition:transform .2s var(--ease),box-shadow .2s}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
  .kpiIc{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .kpiIc svg{width:22px;height:22px}
  .kpi .l{font-size:12.5px;color:var(--t2);font-weight:600}
  .kpi .v{font-size:26px;font-weight:900;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:11.5px;font-weight:700;margin-top:4px}
  .up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--t3)}
  @media(max-width:520px){.opt{display:none}}
  @media(max-width:520px){.kpi{padding:14px;gap:10px}.kpiIc{width:38px;height:38px}.kpi .v{font-size:21px}}

  .chart{position:relative;height:250px}

  /* Filas */
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-radius:14px;transition:background .15s}
  button.row:hover{background:var(--muted)}
  .rows .row+.row{border-top:1px solid var(--border);border-radius:0}
  .rows button.row+button.row:hover{border-radius:0}
  .rowInfo{flex:1;min-width:0}
  .rowT{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowS{font-size:12.5px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowR{text-align:right;flex-shrink:0}
  .amt{font-weight:800;font-variant-numeric:tabular-nums}
  .chev{color:var(--t3)}
  .av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#2563EB18;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800}
  .veh{width:40px;height:40px;object-fit:contain;flex-shrink:0}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}

  /* Atención */
  .alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;width:100%;text-align:left;transition:transform .15s var(--ease),filter .2s}
  .alert:hover{transform:translateX(3px);filter:brightness(.98)}
  .alert .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff8}
  .alert b{font-size:20px;font-weight:900;margin-left:auto;font-variant-numeric:tabular-nums}

  /* Filtros */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:0 12px;height:44px;box-shadow:var(--sh1)}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex:1;border:none;outline:none;font-size:14px;background:none;color:var(--t1)}
  .search svg{color:var(--t3)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:13px;color:var(--t2);display:inline-flex;align-items:center;gap:6px;transition:all .2s}
  .chip:hover{border-color:#CBD5E1;color:var(--t1)}
  .chip.on{background:var(--t1);border-color:var(--t1);color:#fff}
  .chip i{font-style:normal;opacity:.6;font-size:12px}

  /* Tabla */
  .tableWrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);text-align:left;padding:12px 14px;font-weight:700;border-bottom:1px solid var(--border)}
  td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:#F8FAFC}

  /* Vacío / carga */
  .empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;text-align:center;color:var(--t2)}
  .empty .lot{width:120px;height:120px}
  .empty b{color:var(--t1);font-size:15px}
  .sk{border-radius:12px;background:linear-gradient(90deg,#EEF2F7 25%,#F8FAFC 50%,#EEF2F7 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}

  /* Modal */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;animation:fade .2s both}
  .sheet{background:var(--bg);border-radius:22px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);animation:pop .3s var(--ease) both}
  .sheetHead{display:flex;align-items:center;gap:14px;padding:20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
  .sheetHead .x{margin-left:auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
  .sheetHead .x:hover{background:var(--muted)}
  .sheetBody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
  .fotos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .foto{position:relative;border-radius:14px;overflow:hidden;background:var(--muted);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:var(--t3);border:1px solid var(--border)}
  .foto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .3s var(--ease)}
  .foto img:hover{transform:scale(1.04)}
  .foto span{position:absolute;left:8px;bottom:8px;background:rgba(15,23,42,.7);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
  .datos{background:#fff;border:1px solid var(--border);border-radius:14px;padding:2px 14px}
  .dato{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:13.5px}
  .dato+.dato{border-top:1px solid var(--border)}
  .dato .k{color:var(--t2);font-weight:600}
  .dato .v{font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .acciones .btn{width:100%}
  .peligro{display:flex;align-items:center;gap:12px;padding:14px;border:1px dashed #FCA5A5;border-radius:14px;background:#FFF8F8}
  .peligro div{flex:1;min-width:0}
  .peligro b{display:block;font-size:13.5px}
  .peligro span{font-size:12px;color:var(--t2)}
  .avBtn{border-radius:50%;cursor:zoom-in;transition:transform .2s var(--ease)}
  .avBtn:hover{transform:scale(1.05)}
  .confirm{max-width:400px;padding:24px;display:flex;flex-direction:column;gap:12px;background:#fff}
  .confirm h3{font-size:18px;font-weight:800}
  .confirm p{color:var(--t2);line-height:1.5}
  .confirm .btns{display:flex;gap:10px;margin-top:6px}
  .confirm .btns .btn{flex:1}
  .lightbox{background:rgba(2,6,23,.92)}
  .lightbox img{max-width:94vw;max-height:90vh;border-radius:14px;animation:pop .3s var(--ease) both}

  /* Soporte */
  .soporte{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 150px);min-height:480px;overflow:hidden}
  .convs{border-right:1px solid var(--border);overflow-y:auto;padding:8px}
  .conv.on{background:#2563EB12}
  .chat{display:flex;flex-direction:column;min-width:0}
  .chatHead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .chatBody{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
  .msg{max-width:74%;padding:9px 13px;border-radius:16px;line-height:1.4;animation:up .3s var(--ease) both;word-wrap:break-word}
  .msg.otro{align-self:flex-start;background:#fff;border:1px solid var(--border);border-top-left-radius:5px}
  .msg.mio{align-self:flex-end;background:var(--accent);color:#fff;border-top-right-radius:5px}
  .msg small{display:block;font-size:10.5px;opacity:.65;text-align:right;margin-top:3px}
  .chatIn{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
  .chatIn input{flex:1;border:1px solid var(--border);border-radius:12px;padding:0 14px;height:44px;outline:none;background:var(--bg);font-size:14px}
  .chatIn input:focus{border-color:var(--accent);background:#fff}
  .back{display:none}
  @media(max-width:900px){
    .soporte{grid-template-columns:1fr;height:calc(100vh - 120px)}
    .soporte.abierto .convs{display:none}
    .soporte:not(.abierto) .chat{display:none}
    .back{display:flex}
  }

  /* Ruta del viaje (mapa) */
  .sheet.ruta{max-width:780px}
  .mapa{height:min(52vh,420px);background:#E5EEF9}
  .pulso{width:18px;height:18px;border-radius:50%;border:3px solid #fff;animation:pulso 1.8s infinite}
  @keyframes pulso{from{box-shadow:0 0 0 0 var(--c)}to{box-shadow:0 0 0 16px transparent}}
  .inicio{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--c)}
  .rastro{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:14px}
  .rastro .punto{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .rastro div{flex:1;min-width:0}
  .vivo{display:inline-flex;align-items:center;gap:8px;color:var(--red);font-weight:800;font-size:12px}
  .vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);--c:#DC262680;animation:pulso 1.4s infinite}

  /* Toast */
  #toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:80}
  .toast{display:flex;align-items:center;gap:10px;background:var(--t1);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--sh2);font-weight:600;animation:pop .3s var(--ease) both}
  .toast.err{background:var(--red)}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="loginArt"><div class="loginRadar"><div id="radar" style="width:360px;height:360px"></div><img src="assets/logo.png" alt=""></div></div>
  <form class="loginForm" id="loginForm">
    <h1>Panel Admin</h1>
    <p class="sub">RutaExpress · Montalvo</p>
    <label class="field"><i data-lucide="lock"></i><input id="pwd" type="password" placeholder="Contraseña del administrador" autocomplete="current-password" required></label>
    <button class="btn pri full" id="loginBtn" type="submit">Entrar <i data-lucide="arrow-right"></i></button>
    <p class="hint">Acceso exclusivo del administrador.</p>
  </form>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <div class="layout">
    <div class="scrim" id="scrim" onclick="menu(false)"></div>
    <aside class="side" id="side">
      <div class="brand"><img src="assets/logo.png" alt=""><div><b>RutaExpress</b><span>Panel admin · Montalvo</span></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="sideFoot"><div class="av">A</div><div><b>Admin</b><span>Administrador</span></div>
        <button id="logoutBtn" title="Cerrar sesión"><i data-lucide="log-out"></i></button></div>
    </aside>
    <main class="main">
      <div class="top">
        <button class="hamb" onclick="menu()"><i data-lucide="menu"></i></button>
        <div><h2 id="titulo">Inicio</h2><div class="sub" id="subtitulo"></div></div>
        <div class="sp"></div>
        <button class="btn soft sm" onclick="cargarTodo()" title="Actualizar"><i data-lucide="refresh-cw"></i><span>Actualizar</span></button>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>
</div>

<div id="modal"></div>
<div id="toasts"></div>

<!-- Librerías (versiones fijas) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

// --- utilidades ---
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// La BD guarda timestamps sin zona en UTC: igual que parseFecha() de la app.
const fecha = v => { if (!v) return null; let s = String(v).replace(' ', 'T'); if (!/[zZ]|[+-]\d\d:?\d\d$/.test(s)) s += 'Z'; const d = new Date(s); return isNaN(d) ? null : d; };
const ts = v => fecha(v)?.getTime() || 0;
const fFecha = v => fecha(v)?.toLocaleDateString('es-EC', {timeZone:TZ, day:'2-digit', month:'short', year:'numeric'}) || '—';
const diaEC = v => fecha(v)?.toLocaleDateString('en-CA', {timeZone:TZ}) || '';
const cuando = v => {
  const d = fecha(v); if (!d) return '—';
  const h = d.toLocaleTimeString('es-EC', {timeZone:TZ, hour:'2-digit', minute:'2-digit'});
  if (diaEC(v) === diaEC(new Date())) return 'Hoy, ' + h;
  return d.toLocaleDateString('es-EC', {timeZone:TZ, day:'2-digit', month:'short'}) + ', ' + h;
};
const money = n => '$' + Number(n || 0).toLocaleString('es-EC', {minimumFractionDigits:2, maximumFractionDigits:2});
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const ic = (n, extra = '') => `<i data-lucide="${n}" ${extra}></i>`;

const pill = (txt, color, icon) => `<span class="pill" style="background:${color}17;color:${color}">${icon ? ic(icon, 'style="width:13px;height:13px"') : ''}${esc(txt)}</span>`;
const vacio = (titulo, texto, lottie) => `<div class="empty">${lottie ? `<div class="lot" data-lottie="${lottie}"></div>` : ic('inbox', 'style="width:36px;height:36px;color:#CBD5E1"')}<b>${titulo}</b><span>${texto || ''}</span></div>`;

const ESTADO = {APROBADO:['Activo','#16A34A'], PENDIENTE:['Pendiente','#EA7A00'], SUSPENDIDO:['Suspendido','#7C3AED'], RECHAZADO:['Rechazado','#DC2626']};
const pillEstado = e => pill(...(ESTADO[e] || [e || '—', '#64748B']));
const VIAJE = {COMPLETADO:['Completado','#16A34A'], 'EN CURSO':['En curso','#2563EB'], SOLICITADO:['Buscando','#EA7A00'], CANCELADO:['Cancelado','#DC2626']};
const pillViaje = e => pill(...(VIAJE[e] || [e || '—', '#64748B']));

function suscripcion(c){
  if (!c.suscripcion_vence) return {txt:'Sin suscripción', color:'#64748B', clave:'sin'};
  const dias = Math.ceil((ts(c.suscripcion_vence) - Date.now()) / DIA);
  if (dias < 0) return {dias, txt:`Vencida hace ${plural(-dias, 'día', 'días')}`, color:'#DC2626', clave:'vencida'};
  if (dias <= 3) return {dias, txt: dias === 0 ? 'Vence hoy' : `Vence en ${plural(dias, 'día', 'días')}`, color:'#EA7A00', clave:'porVencer'};
  return {dias, txt:`Vence en ${dias} días`, color:'#16A34A', clave:'activa'};
}
const nombre = (lista, id) => lista.find(x => x.id === id)?.nombre_completo || '—';

// --- toast / confirmación / lightbox ---
function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : '');
  t.innerHTML = ic(err ? 'alert-circle' : 'check-circle-2') + esc(msg); $('toasts').append(t); lucide.createIcons();
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 3200);
}
function confirmar({titulo, texto, ok = 'Confirmar', tipo = 'pri'}){
  return new Promise(res => {
    const capa = document.createElement('div'); capa.className = 'backdrop';
    capa.innerHTML = `<div class="sheet confirm"><h3>${esc(titulo)}</h3><p>${texto}</p>
      <div class="btns"><button class="btn soft" data-r="0">Cancelar</button><button class="btn ${tipo}" data-r="1">${esc(ok)}</button></div></div>`;
    capa.onclick = e => { const r = e.target.closest('[data-r]')?.dataset.r ?? (e.target === capa ? '0' : null); if (r === null) return; capa.remove(); res(r === '1'); };
    document.body.append(capa); capa.querySelector('[data-r="1"]').focus();
  });
}
function verImagen(url){
  const capa = document.createElement('div'); capa.className = 'backdrop lightbox';
  capa.innerHTML = `<img src="${esc(url)}" alt="">`; capa.onclick = () => capa.remove(); document.body.append(capa);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const b = [...document.querySelectorAll('.backdrop')].pop(); if (b) b.click(); else cerrarModal(); } });

// --- Lottie: monta todo [data-lottie] que aparezca ---
function montarLottie(root = document){
  root.querySelectorAll('[data-lottie]:not([data-on])').forEach(el => {
    el.dataset.on = 1;
    lottie.loadAnimation({container:el, renderer:'svg', loop:el.dataset.loop !== undefined, autoplay:true, path:el.dataset.lottie});
  });
}
// --- contador animado para KPIs ---
function contar(root = document){
  root.querySelectorAll('[data-count]').forEach(el => {
    const fin = Number(el.dataset.count), dinero = el.dataset.money !== undefined, t0 = performance.now(), dur = 700;
    const paso = t => { const p = Math.min(1, Math.max(0, (t - t0) / dur)), v = fin * (1 - Math.pow(1 - p, 3));
      el.textContent = dinero ? money(v) : Math.round(v).toLocaleString('es-EC'); if (p < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
    setTimeout(() => paso(t0 + dur), dur + 150); // respaldo si rAF está pausado (pestaña en segundo plano)
  });
}

// --- datos (volumen de un cantón: se carga todo y se filtra en el navegador) ---
// ponytail: si algún día hay miles de filas, paginar y mover conteos a SQL.
async function cargarTodo(){
  cargando = true; render();
  const [c, p, v, can, pg, sop] = await Promise.all([
    sb.from('conductores').select('*').order('fecha_registro', {ascending:false}),
    sb.from('pasajeros').select('*').order('fecha_registro', {ascending:false}),
    sb.from('viajes').select('id,origen,destino,fecha_hora,tarifa,estado,conductor_id,pasajero_id,tipo_vehiculo,calificacion_conductor,ultima_lat,ultima_lng,ultima_ubicacion_at').order('fecha_hora', {ascending:false}),
    sb.from('cancelaciones').select('*').order('fecha_hora', {ascending:false}).limit(300),
    sb.from('pagos_suscripcion').select('*').order('fecha', {ascending:false}).limit(500),
    sb.from('soporte_mensajes').select('*').order('fecha', {ascending:true}),
  ]);
  const err = [c, p, v, can, pg, sop].find(r => r.error);
  if (err) toast('Error cargando datos: ' + err.error.message, true);
  conductores = c.data || []; pasajeros = p.data || []; viajes = v.data || [];
  cancelaciones = can.data || []; pagos = pg.data || []; soporte = sop.data || [];
  cargando = false; render();
}
async function recargarSoporte(){
  const {data} = await sb.from('soporte_mensajes').select('*').order('fecha', {ascending:true});
  soporte = data || []; render();
}

// --- acciones ---
const unMesDesde = desde => { const b = desde && ts(desde) > Date.now() ? fecha(desde) : new Date(); b.setMonth(b.getMonth() + 1); return b.toISOString(); };

async function activarPlan(id, modo){ // modo: 'aprobar' | 'renovar'
  const c = conductores.find(x => x.id === id); if (!c) return;
  const k = planDe(c), plan = PLANES[k];
  const ok = await confirmar({
    titulo: modo === 'aprobar' ? `Aprobar a ${c.nombre_completo}` : `Renovar a ${c.nombre_completo}`,
    texto: `Plan <b>${plan.nombre}</b> · <b>${money(plan.precio)}</b>. Se registra el pago y se ${modo === 'aprobar' ? 'activa' : 'suma'} 1 mes de servicio.`,
    ok: modo === 'aprobar' ? 'Aprobar y cobrar' : 'Renovar y cobrar', tipo:'ok',
  });
  if (!ok) return;
  const upd = {plan:k, suscripcion_inicio:new Date().toISOString(), suscripcion_vence:unMesDesde(modo === 'renovar' ? c.suscripcion_vence : null)};
  if (modo === 'aprobar') Object.assign(upd, {estado:'APROBADO', verificado:true, fecha_aprobacion:new Date().toISOString()});
  const {error} = await sb.from('conductores').update(upd).eq('id', id);
  if (error) return toast('No se pudo actualizar: ' + error.message, true);
  const {error:e2} = await sb.from('pagos_suscripcion').insert({conductor_id:id, plan:k, monto:plan.precio, estado:'PAGADO'});
  toast(e2 ? 'Suscripción activa, pero el pago no se registró' : `${modo === 'aprobar' ? 'Aprobado' : 'Renovado'} · ${money(plan.precio)}`, !!e2);
  cerrarModal(); cargarTodo();
}

async function cambiarEstado(id, tipo, estado){
  const tabla = tipo === 'conductor' ? 'conductores' : 'pasajeros';
  const u = (tipo === 'conductor' ? conductores : pasajeros).find(x => x.id === id); if (!u) return;
  const textos = {
    RECHAZADO: ['Rechazar registro', `${esc(u.nombre_completo)} no podrá usar la app.`, 'Rechazar', 'solidRed'],
    SUSPENDIDO: ['Suspender cuenta', `${esc(u.nombre_completo)} no podrá usar la app hasta que la reactives.`, 'Suspender', 'warn'],
    APROBADO: ['Activar cuenta', `${esc(u.nombre_completo)} podrá volver a usar la app.`, 'Activar', 'ok'],
  }[estado];
  if (!await confirmar({titulo:textos[0], texto:textos[1], ok:textos[2], tipo:textos[3]})) return;
  const upd = {estado, verificado: estado === 'APROBADO'};
  if (estado === 'APROBADO' && !u.fecha_aprobacion) upd.fecha_aprobacion = new Date().toISOString();
  const {error} = await sb.from(tabla).update(upd).eq('id', id);
  if (error) return toast('No se pudo actualizar: ' + error.message, true);
  toast('Estado actualizado'); cerrarModal(); cargarTodo();
}

async function eliminarUsuario(id, tipo){
  const u = (tipo === 'conductor' ? conductores : pasajeros).find(x => x.id === id); if (!u) return;
  if (!await confirmar({titulo:'Eliminar cuenta', texto:`Se borrará a <b>${esc(u.nombre_completo)}</b> de forma permanente. Esta acción no se puede deshacer.`, ok:'Eliminar', tipo:'solidRed'})) return;
  const {error} = await sb.from(tipo === 'conductor' ? 'conductores' : 'pasajeros').delete().eq('id', id);
  if (error) return toast('No se pudo eliminar: ' + error.message, true);
  toast('Cuenta eliminada'); cerrarModal(); cargarTodo();
}

// --- navegación / render ---
function ir(k, f = 'todos'){ tab = k; filtro = f; busqueda = ''; chat = null; menu(false); render(); window.scrollTo({top:0}); }
function setFiltro(f){ filtro = f; render(); }

function render(){
  charts.splice(0).forEach(c => c.destroy());
  const pend = conductores.filter(c => c.estado === 'PENDIENTE').length + pasajeros.filter(p => p.estado === 'PENDIENTE').length;
  const noLeidos = conversaciones().reduce((s, c) => s + c.noLeidos, 0);
  const badges = {solicitudes:pend, soporte:noLeidos};
  $('nav').innerHTML = NAV.map(n => `<button class="navItem ${tab === n.k ? 'active' : ''}" onclick="ir('${n.k}')">${ic(n.ic)}${n.l}${badges[n.k] ? `<span class="navBadge">${badges[n.k]}</span>` : ''}</button>`).join('');
  const n = NAV.find(x => x.k === tab);
  $('titulo').textContent = n.l; $('subtitulo').textContent = n.sub;

  // Conserva lo que se está escribiendo (búsqueda/chat) al redibujar.
  const act = document.activeElement, idAct = act?.id, val = idAct ? act.value : null, pos = act?.selectionStart;
  const chatTxt = $('chatTxt')?.value;

  $('content').innerHTML = cargando ? esqueleto() : ({inicio, solicitudes, conductores:vistaConductores, pasajeros:vistaPasajeros, viajes:vistaViajes, suscripciones, soporte:vistaSoporte})[tab]();

  if (chatTxt && $('chatTxt')) $('chatTxt').value = chatTxt;
  if (idAct && $(idAct)) { const el = $(idAct); if (val != null) el.value = val; el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
  $('buscar')?.addEventListener('input', e => { busqueda = e.target.value; render(); });
  lucide.createIcons(); montarLottie($('content')); contar($('content'));
  if (!cargando) { if (tab === 'inicio') graficoViajes(); if (tab === 'suscripciones') graficoIngresos(); }
  const cb = $('chatBody'); if (cb) cb.scrollTop = cb.scrollHeight;
}

const esqueleto = () => `<div class="grid4">${'<div class="sk" style="height:96px"></div>'.repeat(4)}</div>
  <div class="grid2"><div class="sk" style="height:300px"></div><div class="sk" style="height:300px"></div></div>`;

function kpi(i, icono, color, valor, label, d, dinero){
  const dt = d === undefined ? '' : d === null ? `<div class="d neutral">Sin datos de la semana anterior</div>`
    : typeof d === 'string' ? `<div class="d neutral">${d}</div>`
    : `<div class="d ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(0)}% <span class="neutral">vs periodo anterior</span></div>`;
  return `<div class="card kpi in" style="--i:${i}"><div class="kpiIc" style="background:${color}17;color:${color}">${ic(icono)}</div>
    <div style="min-width:0"><div class="l">${label}</div><div class="v" data-count="${valor}" ${dinero ? 'data-money' : ''}>0</div>${dt}</div></div>`;
}
const variacion = (a, b) => b ? (a - b) / b * 100 : (a ? 100 : null);
const enVentana = (arr, campo, desde, hasta) => arr.filter(x => { const t = ts(x[campo]); return t > desde && t <= hasta; });

// ===== Inicio =====
function inicio(){
  const v7 = enVentana(viajes, 'fecha_hora', hace(7), Date.now()), v14 = enVentana(viajes, 'fecha_hora', hace(14), hace(7));
  const pagosOk = pagos.filter(p => p.estado === 'PAGADO');
  const ing30 = enVentana(pagosOk, 'fecha', hace(30), Date.now()).reduce((s, p) => s + Number(p.monto || 0), 0);
  const activos = conductores.filter(c => c.estado === 'APROBADO');
  const pendC = conductores.filter(c => c.estado === 'PENDIENTE'), pendP = pasajeros.filter(p => p.estado === 'PENDIENTE');
  const vencidas = activos.filter(c => suscripcion(c).clave === 'vencida');
  const porVencer = activos.filter(c => suscripcion(c).clave === 'porVencer');
  const noLeidos = conversaciones().filter(c => c.noLeidos);

  let h = `<div class="grid4">
    ${kpi(0, 'route', '#2563EB', v7.length, 'Viajes (7 días)', variacion(v7.length, v14.length))}
    ${kpi(1, 'wallet', '#16A34A', ing30, 'Ingresos por suscripciones (30 días)', 'Pagos registrados', true)}
    ${kpi(2, 'id-card', '#7C3AED', activos.length, 'Conductores activos', `${plural(pasajeros.filter(p => p.estado === 'APROBADO').length, 'pasajero activo', 'pasajeros activos')}`)}
    ${kpi(3, 'inbox', '#EA7A00', pendC.length + pendP.length, 'Solicitudes por revisar', pendC.length + pendP.length ? 'Revísalas en Solicitudes' : 'Todo al día')}
  </div>`;

  const atencion = [
    [pendC.length + pendP.length, 'Registros por aprobar', `${plural(pendC.length, 'conductor', 'conductores')} · ${plural(pendP.length, 'pasajero', 'pasajeros')}`, 'user-check', '#EA7A00', "ir('solicitudes')"],
    [vencidas.length, 'Suscripciones vencidas', 'Conductores que deben renovar', 'alert-triangle', '#DC2626', "ir('suscripciones','vencida')"],
    [porVencer.length, 'Vencen en 3 días o menos', 'Avísales antes de que venzan', 'clock', '#D97706', "ir('suscripciones','porVencer')"],
    [noLeidos.length, 'Chats sin responder', 'Mensajes nuevos de soporte', 'message-circle', '#2563EB', "ir('soporte')"],
  ].filter(a => a[0]);
  const listaAtencion = atencion.length
    ? atencion.map(([n, t, s, i, c, fn], k) => `<button class="alert in" style="--i:${k + 4};background:${c}10;color:${c}" onclick="${fn}">
        <span class="ic">${ic(i)}</span><span><div style="font-weight:800;color:var(--t1)">${t}</div><div class="muted">${s}</div></span><b>${n}</b></button>`).join('')
    : vacio('Todo al día', 'No hay nada pendiente por ahora.', 'assets/completado.json');

  const recientes = viajes.slice(0, 6).map(v => `<div class="row">
      <img class="veh" src="${vehiculo(v.tipo_vehiculo).img}" alt="">
      <div class="rowInfo"><div class="rowT">${esc(v.origen || 'Origen')} → ${esc(v.destino)}</div>
        <div class="rowS">${esc(nombre(pasajeros, v.pasajero_id))} · ${cuando(v.fecha_hora)}</div></div>
      <div class="rowR"><div class="amt">${money(v.tarifa)}</div>${pillViaje(v.estado)}</div></div>`).join('');

  h += `<div class="grid2">
    <div class="card pad in" style="--i:4"><div class="head"><h3>Viajes de los últimos 14 días</h3><span class="muted">Completados vs cancelados</span></div>
      <div class="chart"><canvas id="gViajes"></canvas></div></div>
    <div class="card pad in" style="--i:5"><div class="head"><h3>Necesita tu atención</h3></div>
      <div style="display:flex;flex-direction:column;gap:8px">${listaAtencion}</div></div>
  </div>
  <div class="card pad in" style="--i:6"><div class="head"><h3>Viajes recientes</h3><button class="link" onclick="ir('viajes')">Ver todos</button></div>
    <div class="rows">${recientes || vacio('Aún no hay viajes')}</div></div>`;
  return h;
}

function estiloGraficos(){
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; Chart.defaults.color = '#94A3B8';
  Chart.defaults.plugins.tooltip.backgroundColor = '#0F172A'; Chart.defaults.plugins.tooltip.padding = 10; Chart.defaults.plugins.tooltip.cornerRadius = 10;
}
function serieDias(n, fn){
  const labels = [], dias = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(Date.now() - i * DIA); dias.push(d.toLocaleDateString('en-CA', {timeZone:TZ})); labels.push(d.toLocaleDateString('es-EC', {timeZone:TZ, day:'2-digit', month:'short'})); }
  return {labels, data: dias.map(fn)};
}
function graficoViajes(){
  const ctx = $('gViajes'); if (!ctx) return; estiloGraficos();
  const comp = serieDias(14, d => viajes.filter(v => v.estado === 'COMPLETADO' && diaEC(v.fecha_hora) === d).length);
  const canc = serieDias(14, d => viajes.filter(v => v.estado === 'CANCELADO' && diaEC(v.fecha_hora) === d).length);
  const g = ctx.getContext('2d').createLinearGradient(0, 0, 0, 250); g.addColorStop(0, '#2563EB33'); g.addColorStop(1, '#2563EB00');
  charts.push(new Chart(ctx, {type:'line',
    data:{labels:comp.labels, datasets:[
      {label:'Completados', data:comp.data, borderColor:'#2563EB', backgroundColor:g, fill:true, tension:.4, pointRadius:0, pointHoverRadius:5, borderWidth:2.5},
      {label:'Cancelados', data:canc.data, borderColor:'#F87171', borderDash:[5, 4], tension:.4, pointRadius:0, pointHoverRadius:5, borderWidth:2}]},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      animation:{duration:900, easing:'easeOutQuart'},
      plugins:{legend:{position:'bottom', labels:{usePointStyle:true, boxWidth:8, padding:16}}},
      scales:{y:{beginAtZero:true, ticks:{precision:0}, grid:{color:'#EEF2F7'}, border:{display:false}}, x:{grid:{display:false}, ticks:{maxTicksLimit:7}}}}}));
}

// ===== Solicitudes =====
function solicitudes(){
  const items = [...conductores.filter(c => c.estado === 'PENDIENTE').map(u => ({u, t:'conductor'})),
                 ...pasajeros.filter(p => p.estado === 'PENDIENTE').map(u => ({u, t:'pasajero'}))]
    .sort((a, b) => ts(b.u.fecha_registro) - ts(a.u.fecha_registro));
  if (!items.length) return `<div class="card in">${vacio('No hay solicitudes pendientes', 'Cuando alguien se registre, aparecerá aquí.', 'assets/completado.json')}</div>`;
  return `<div class="card in"><div class="rows">${items.map(({u, t}, i) => `<button class="row in" style="--i:${i}" onclick="detalle('${u.id}','${t}')">
    ${avatar(u, 44)}
    <div class="rowInfo"><div class="rowT">${esc(u.nombre_completo)}<span class="tag" style="background:${t === 'conductor' ? '#2563EB14;color:#2563EB' : '#16A34A14;color:#16A34A'}">${t === 'conductor' ? 'Conductor' : 'Pasajero'}</span></div>
      <div class="rowS">${t === 'conductor' ? `${vehiculo(u.tipo_vehiculo).nombre} · Placa ${esc(u.placa || '—')} · ` : ''}Registrado ${cuando(u.fecha_registro)}</div></div>
    ${t === 'conductor' ? `<img class="veh" src="${vehiculo(u.tipo_vehiculo).img}" alt="">` : ''}
    <span class="btn soft sm">Revisar ${ic('chevron-right')}</span></button>`).join('')}</div></div>`;
}

// ===== Conductores / Pasajeros =====
const coincide = u => { const q = busqueda.trim().toLowerCase(); return !q || [u.nombre_completo, u.cedula, u.placa, u.email].some(x => String(x || '').toLowerCase().includes(q)); };
const chips = (opciones) => `<div class="chips">${opciones.map(([k, l, n]) => `<button class="chip ${filtro === k ? 'on' : ''}" onclick="setFiltro('${k}')">${l}${n != null ? `<i>${n}</i>` : ''}</button>`).join('')}</div>`;
const buscador = ph => `<label class="search">${ic('search')}<input id="buscar" value="${esc(busqueda)}" placeholder="${ph}" autocomplete="off"></label>`;

function vistaConductores(){
  const base = conductores.filter(c => c.estado !== 'PENDIENTE');
  const f = {todos:() => true, activos:c => c.estado === 'APROBADO', vencidas:c => c.estado === 'APROBADO' && suscripcion(c).clave === 'vencida',
    suspendidos:c => c.estado === 'SUSPENDIDO', rechazados:c => c.estado === 'RECHAZADO', buseta:c => c.tipo_vehiculo === 'buseta'};
  const fil = f[filtro] || f.todos;
  const lista = base.filter(fil).filter(coincide);
  const op = [['todos', 'Todos'], ['activos', 'Activos'], ['vencidas', 'Suscripción vencida'], ['buseta', 'Busetas'], ['suspendidos', 'Suspendidos'], ['rechazados', 'Rechazados']]
    .map(([k, l]) => [k, l, base.filter(f[k]).length]);
  return `<div class="toolbar in">${buscador('Buscar por nombre, cédula, placa o email…')}</div>
    <div class="in" style="--i:1">${chips(op)}</div>
    <div class="card in" style="--i:2"><div class="rows">${lista.length ? lista.map((c, i) => {
      const s = suscripcion(c);
      return `<button class="row" onclick="detalle('${c.id}','conductor')">${avatar(c, 44)}
        <div class="rowInfo"><div class="rowT">${esc(c.nombre_completo)}</div>
          <div class="rowS">${vehiculo(c.tipo_vehiculo).nombre} · Placa ${esc(c.placa || '—')}${c.estado === 'APROBADO' ? ` · <span style="color:${s.color};font-weight:700">${s.txt}</span>` : ''}</div></div>
        <img class="veh opt" src="${vehiculo(c.tipo_vehiculo).img}" alt="">
        ${pillEstado(c.estado)}<span class="chev">${ic('chevron-right')}</span></button>`;
    }).join('') : vacio(busqueda ? 'Sin resultados' : 'No hay conductores en este filtro')}</div></div>`;
}

function vistaPasajeros(){
  const base = pasajeros.filter(p => p.estado !== 'PENDIENTE');
  const f = {todos:() => true, activos:p => p.estado === 'APROBADO', suspendidos:p => p.estado === 'SUSPENDIDO', rechazados:p => p.estado === 'RECHAZADO'};
  const lista = base.filter(f[filtro] || f.todos).filter(coincide);

  return `<div class="toolbar in">${buscador('Buscar por nombre, cédula o email…')}</div>
    <div class="in" style="--i:1">${chips(op)}</div>
    <div class="card in" style="--i:2"><div class="rows">${lista.length ? lista.map(p => `<button class="row" onclick="detalle('${p.id}','pasajero')">${avatar(p, 44)}
      <div class="rowInfo"><div class="rowT">${esc(p.nombre_completo)}</div><div class="rowS">CI ${esc(p.cedula || '—')} · ${plural(viajesDe(p.id), 'viaje', 'viajes')}</div></div>
      ${pillEstado(p.estado)}<span class="chev">${ic('chevron-right')}</span></button>`).join('') : vacio(busqueda ? 'Sin resultados' : 'No hay pasajeros en este filtro')}</div></div>`;
}

// ===== Viajes (incluye cancelaciones con su motivo) =====
function vistaViajes(){
  const motivo = {}; cancelaciones.forEach(c => { if (c.viaje_id && !motivo[c.viaje_id]) motivo[c.viaje_id] = c; });
  const f = {todos:() => true, completados:v => v.estado === 'COMPLETADO', curso:v => v.estado === 'EN CURSO' || v.estado === 'SOLICITADO', cancelados:v => v.estado === 'CANCELADO'};
  const q = busqueda.trim().toLowerCase();
  const lista = viajes.filter(f[filtro] || f.todos).filter(v => !q || [v.origen, v.destino, nombre(pasajeros, v.pasajero_id), nombre(conductores, v.conductor_id)].some(x => String(x || '').toLowerCase().includes(q)));
  const op = [['todos', 'Todos'], ['completados', 'Completados'], ['curso', 'En curso'], ['cancelados', 'Cancelados']].map(([k, l]) => [k, l, viajes.filter(f[k]).length]);
  const filas = lista.slice(0, 150).map(v => {
    const m = motivo[v.id];
    return `<tr><td><div style="display:flex;align-items:center;gap:10px"><img class="veh" style="width:34px;height:34px" src="${vehiculo(v.tipo_vehiculo).img}" alt="">
        <div><div style="font-weight:700">${esc(v.origen || 'Origen')} → ${esc(v.destino)}</div>
        ${m ? `<div class="muted" style="white-space:normal;max-width:360px">Canceló el ${m.cancelado_por === 'conductor' ? 'conductor' : 'pasajero'}: “${esc(m.motivo)}”</div>` : ''}</div></div></td>
      <td>${esc(nombre(pasajeros, v.pasajero_id))}</td><td>${esc(nombre(conductores, v.conductor_id))}</td>
      <td class="muted">${cuando(v.fecha_hora)}</td><td class="amt">${money(v.tarifa)}</td><td>${pillViaje(v.estado)}</td>
      <td style="text-align:right">${conRuta(v) ? `<button class="btn ${v.estado === 'EN CURSO' ? 'pri' : 'soft'} sm" onclick="verRuta('${v.id}')">${ic('map-pinned')} ${v.estado === 'EN CURSO' ? 'En vivo' : 'Ruta'}</button>` : ''}</td></tr>`;
  }).join('');
  return `<div class="toolbar in">${buscador('Buscar por lugar, pasajero o conductor…')}</div>
    <div class="in" style="--i:1">${chips(op)}</div>
    <div class="card tableWrap in" style="--i:2">${lista.length ? `<table><thead><tr><th>Ruta</th><th>Pasajero</th><th>Conductor</th><th>Fecha</th><th>Tarifa</th><th>Estado</th><th></th></tr></thead><tbody>${filas}</tbody></table>
      ${lista.length > 150 ? `<div class="muted" style="padding:12px 14px">Mostrando 150 de ${lista.length}. Usa la búsqueda para encontrar uno específico.</div>` : ''}` : vacio('No hay viajes en este filtro')}</div>`;
}

// ===== Suscripciones =====
function suscripciones(){
  const activos = conductores.filter(c => c.estado === 'APROBADO');
  const por = k => activos.filter(c => suscripcion(c).clave === k);
  const pagosOk = pagos.filter(p => p.estado === 'PAGADO');
  const suma = a => a.reduce((s, p) => s + Number(p.monto || 0), 0);
  const ing30 = suma(enVentana(pagosOk, 'fecha', hace(30), Date.now()));
  const ingPrev = suma(enVentana(pagosOk, 'fecha', hace(60), hace(30)));
  const vigentes = activos.filter(c => ['activa', 'porVencer'].includes(suscripcion(c).clave));

  const f = {todos:() => true, vencida:c => suscripcion(c).clave === 'vencida', porVencer:c => suscripcion(c).clave === 'porVencer', activa:c => suscripcion(c).clave === 'activa'};
  const lista = activos.filter(f[filtro] || f.todos).sort((a, b) => ts(a.suscripcion_vence) - ts(b.suscripcion_vence));
  const op = [['todos', 'Todas'], ['vencida', 'Vencidas'], ['porVencer', 'Por vencer'], ['activa', 'Al día']].map(([k, l]) => [k, l, activos.filter(f[k]).length]);

  const filas = lista.map(c => {
    const s = suscripcion(c), p = PLANES[planDe(c)];
    return `<tr><td><div style="display:flex;align-items:center;gap:10px">${avatar(c, 34)}<div><div style="font-weight:700">${esc(c.nombre_completo)}</div><div class="muted">${vehiculo(c.tipo_vehiculo).nombre} · ${esc(c.placa || '—')}</div></div></div></td>
      <td>${pill(p.nombre, p.color)}</td><td>${pill(s.txt, s.color)}</td><td class="muted">${fFecha(c.suscripcion_vence)}</td><td class="amt">${money(p.precio)}</td>
      <td style="text-align:right"><button class="btn ${s.clave === 'activa' ? 'soft' : 'ok'} sm" onclick="activarPlan('${c.id}','renovar')">${ic('rotate-cw')} Renovar</button></td></tr>`;
  }).join('');

  const txs = pagos.slice(0, 8).map(p => {
    const c = conductores.find(x => x.id === p.conductor_id), pl = PLANES[p.plan];
    return `<div class="row">${avatar(c, 36)}<div class="rowInfo"><div class="rowT">${esc(c?.nombre_completo || 'Conductor eliminado')}</div>
      <div class="rowS">${pl ? pl.nombre : esc(p.plan || '—')} · ${cuando(p.fecha)}</div></div><div class="amt">${money(p.monto)}</div></div>`;
  }).join('');

  return `<div class="grid4">
      ${kpi(0, 'wallet', '#16A34A', ing30, 'Ingresos (30 días)', ingPrev ? variacion(ing30, ingPrev) : 'Pagos registrados', true)}
      ${kpi(1, 'badge-check', '#2563EB', vigentes.length, 'Suscripciones al día', `de ${plural(activos.length, 'conductor activo', 'conductores activos')}`)}
      ${kpi(2, 'clock', '#D97706', por('porVencer').length, 'Vencen en ≤ 3 días', 'Avisa para renovar')}
      ${kpi(3, 'alert-triangle', '#DC2626', por('vencida').length, 'Vencidas', 'Renueva al recibir el pago')}
    </div>
    <div class="in" style="--i:4">${chips(op)}</div>
    <div class="card tableWrap in" style="--i:5">${lista.length ? `<table><thead><tr><th>Conductor</th><th>Plan</th><th>Estado</th><th>Vence</th><th>Monto</th><th></th></tr></thead><tbody>${filas}</tbody></table>` : vacio('Nada en este filtro', '', 'assets/completado.json')}</div>
    <div class="grid2">
      <div class="card pad in" style="--i:6"><div class="head"><h3>Ingresos por día</h3><span class="muted">Últimos 30 días</span></div><div class="chart" style="height:220px"><canvas id="gIngresos"></canvas></div></div>
      <div class="card pad in" style="--i:7"><div class="head"><h3>Últimos pagos</h3></div><div class="rows">${txs || vacio('Aún no hay pagos')}</div></div>
    </div>`;
}
function graficoIngresos(){
  const ctx = $('gIngresos'); if (!ctx) return; estiloGraficos();
  const s = serieDias(30, d => pagos.filter(p => p.estado === 'PAGADO' && diaEC(p.fecha) === d).reduce((t, p) => t + Number(p.monto || 0), 0));
  charts.push(new Chart(ctx, {type:'bar', data:{labels:s.labels, datasets:[{label:'Ingresos', data:s.data, backgroundColor:'#22C55E', borderRadius:6, maxBarThickness:18}]},
    options:{responsive:true, maintainAspectRatio:false, animation:{duration:800, easing:'easeOutQuart'}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => money(c.raw)}}},
      scales:{y:{beginAtZero:true, ticks:{callback:v => '$' + v}, grid:{color:'#EEF2F7'}, border:{display:false}}, x:{grid:{display:false}, ticks:{maxTicksLimit:8}}}}}));
}

// ===== Soporte: lista + chat en dos paneles =====
function conversaciones(){
  const g = {};
  soporte.forEach(m => {
    const tipo = m.pasajero_id ? 'pasajero' : 'conductor', id = m.pasajero_id || m.conductor_id; if (!id) return;
    (g[tipo + ':' + id] ??= {tipo, id, msgs:[]}).msgs.push(m);
  });
  return Object.values(g).map(c => ({...c, ultimo:c.msgs[c.msgs.length - 1],
    noLeidos:c.msgs.filter(m => m.remitente !== 'admin' && !m.leido_admin).length,
    persona:(c.tipo === 'conductor' ? conductores : pasajeros).find(x => x.id === c.id)})).sort((a, b) => ts(b.ultimo.fecha) - ts(a.ultimo.fecha));
}
function vistaSoporte(){
  const convs = conversaciones();
  if (!convs.length) return `<div class="card in">${vacio('Sin conversaciones', 'Los mensajes de soporte de la app aparecerán aquí.')}</div>`;
  const lista = convs.map(c => `<button class="row conv ${chat && chat.id === c.id ? 'on' : ''}" onclick="abrirChat('${c.tipo}','${c.id}')">${avatar(c.persona, 42)}
    <div class="rowInfo"><div class="rowT">${esc(c.persona?.nombre_completo || (c.tipo === 'conductor' ? 'Conductor' : 'Pasajero'))}</div>
      <div class="rowS"><b style="color:${c.tipo === 'conductor' ? '#2563EB' : '#16A34A'}">${c.tipo === 'conductor' ? 'Conductor' : 'Pasajero'}</b> · ${c.ultimo.remitente === 'admin' ? 'Tú: ' : ''}${esc(c.ultimo.texto)}</div></div>
    <div class="rowR"><div class="muted">${cuando(c.ultimo.fecha).replace('Hoy, ', '')}</div>${c.noLeidos ? `<span class="navBadge" style="margin-top:4px">${c.noLeidos}</span>` : ''}</div></button>`).join('');
  const c = chat && convs.find(x => x.id === chat.id && x.tipo === chat.tipo);
  const panel = c ? `<div class="chatHead"><button class="btn soft sm back" onclick="chat=null;render()">${ic('arrow-left')}</button>${avatar(c.persona, 38)}
      <div style="flex:1;min-width:0"><div style="font-weight:800">${esc(c.persona?.nombre_completo || 'Usuario')}</div><div class="muted">${c.tipo === 'conductor' ? 'Conductor · ' + (PLANES[c.persona?.plan]?.nombre || 'sin plan') : 'Pasajero'}</div></div>
      ${c.persona ? `<button class="btn soft sm" onclick="detalle('${c.id}','${c.tipo}')">${ic('user')} Perfil</button>` : ''}</div>
    <div class="chatBody" id="chatBody">${c.msgs.map(m => `<div class="msg ${m.remitente === 'admin' ? 'mio' : 'otro'}">${esc(m.texto)}<small>${cuando(m.fecha)}</small></div>`).join('')}</div>
    <form class="chatIn" onsubmit="event.preventDefault();responder()"><input id="chatTxt" placeholder="Escribe una respuesta…" autocomplete="off"><button class="btn pri" type="submit">${ic('send')}</button></form>`
    : `<div style="flex:1;display:flex;align-items:center;justify-content:center">${vacio('Elige una conversación', 'Selecciona un chat de la izquierda para responder.')}</div>`;
  return `<div class="card soporte ${c ? 'abierto' : ''} in"><div class="convs rows">${lista}</div><div class="chat">${panel}</div></div>`;
}
async function abrirChat(tipo, id){
  chat = {tipo, id}; render(); $('chatTxt')?.focus();
  const col = tipo === 'pasajero' ? 'pasajero_id' : 'conductor_id';
  if (soporte.some(m => m[col] === id && m.remitente === tipo && !m.leido_admin)) {
    soporte = soporte.map(m => m[col] === id && m.remitente === tipo ? {...m, leido_admin:true} : m); render();
    await sb.from('soporte_mensajes').update({leido_admin:true}).eq(col, id).eq('remitente', tipo).eq('leido_admin', false);
  }
}
async function responder(){
  const inp = $('chatTxt'), t = inp?.value.trim(); if (!t || !chat) return;
  inp.value = '';
  const fila = chat.tipo === 'pasajero' ? {pasajero_id:chat.id, remitente:'admin', texto:t} : {conductor_id:chat.id, remitente:'admin', texto:t};
  const {error} = await sb.from('soporte_mensajes').insert(fila);
  if (error) { inp.value = t; return toast('No se pudo enviar: ' + error.message, true); }
  recargarSoporte();
}

// ===== Detalle de usuario =====
async function detalle(id, tipo){
  const esC = tipo === 'conductor', u = (esC ? conductores : pasajeros).find(x => x.id === id); if (!u) return;
  // Cédulas: nuevas en bucket privado (URL firmada 5 min); antiguas, URL http pública.
  const firmar = async v => !v ? null : v.startsWith('http') ? v : (await sb.storage.from('cedulas').createSignedUrl(v, 300)).data?.signedUrl || null;
  const [frontal, posterior] = esC ? await Promise.all([firmar(u.cedula_frontal_url), firmar(u.cedula_posterior_url)]) : [];
  const foto = (url, label) => `<div class="foto">${url ? `<img src="${esc(url)}" alt="" onclick="verImagen(this.src)">` : ic('image-off', 'style="width:26px;height:26px"')}<span>${label}</span></div>`;
  const dato = (k, v) => `<div class="dato"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const hechos = viajes.filter(v => (esC ? v.conductor_id : v.pasajero_id) === id);
  const comp = hechos.filter(v => v.estado === 'COMPLETADO').length;
  const notas = esC ? hechos.filter(v => v.calificacion_conductor != null).map(v => v.calificacion_conductor) : [];
  const s = esC ? suscripcion(u) : null, p = esC ? PLANES[planDe(u)] : null;
  const ultimoViaje = hechos.find(conRuta); // los viajes vienen del más reciente al más antiguo

  let acc = '';
  if (u.estado === 'PENDIENTE') acc = esC
    ? `<button class="btn ok" onclick="activarPlan('${id}','aprobar')">${ic('check')} Aprobar · ${money(p.precio)}</button><button class="btn danger" onclick="cambiarEstado('${id}','${tipo}','RECHAZADO')">${ic('x')} Rechazar</button>`
    : `<button class="btn ok" onclick="cambiarEstado('${id}','${tipo}','APROBADO')">${ic('check')} Aprobar</button><button class="btn danger" onclick="cambiarEstado('${id}','${tipo}','RECHAZADO')">${ic('x')} Rechazar</button>`;
  else if (u.estado === 'APROBADO') acc = (esC ? `<button class="btn ok" onclick="activarPlan('${id}','renovar')">${ic('rotate-cw')} Renovar 1 mes</button>` : '')
    + `<button class="btn warn" onclick="cambiarEstado('${id}','${tipo}','SUSPENDIDO')">${ic('pause')} Suspender</button>`;
  else acc = `<button class="btn ok" onclick="cambiarEstado('${id}','${tipo}','APROBADO')">${ic('play')} Reactivar</button>`;

  $('modal').innerHTML = `<div class="backdrop" onclick="if(event.target===this)cerrarModal()"><div class="sheet">
    <div class="sheetHead">${u.foto_perfil_url ? `<button class="avBtn" onclick="verImagen('${esc(u.foto_perfil_url)}')" title="Ver foto">${avatar(u, 56)}</button>` : avatar(u, 56)}<div style="min-width:0"><div style="font-size:18px;font-weight:900">${esc(u.nombre_completo)}</div>
      <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${pillEstado(u.estado)}${esC ? pill(vehiculo(u.tipo_vehiculo).nombre, '#2563EB') : pill('Pasajero', '#16A34A')}</div></div>
      <button class="x" onclick="cerrarModal()">${ic('x')}</button></div>
    <div class="sheetBody">
      ${esC ? `<div class="fotos">${foto(u.foto_perfil_url, 'Perfil')}${foto(u.foto_vehiculo_url, 'Vehículo')}${foto(frontal, 'Cédula frontal')}${foto(posterior, 'Cédula posterior')}</div>` : ''}
      <div class="datos">
        ${esC ? dato('Placa', esc(u.placa || '—')) : ''}${dato('Cédula', esc(u.cedula || '—'))}${dato('Email', esc(u.email || '—'))}
        ${dato('Registrado', fFecha(u.fecha_registro))}${dato('Viajes', `${comp} completados · ${hechos.length} en total`)}
        ${esC ? dato('Calificación', notas.length ? `⭐ ${(notas.reduce((a, b) => a + b, 0) / notas.length).toFixed(1)} (${notas.length})` : 'Sin calificaciones') : ''}
        ${esC ? dato('Plan', `${p.nombre} · ${money(p.precio)}/mes`) : ''}
        ${esC && u.estado === 'APROBADO' ? dato('Suscripción', pill(s.txt, s.color)) : ''}
      </div>
      ${ultimoViaje ? `<button class="btn soft full" onclick="verRuta('${ultimoViaje.id}')">${ic('map-pinned')} Últimos movimientos <span class="muted">(${cuando(ultimoViaje.fecha_hora)})</span></button>` : ''}
      <div class="acciones">${acc}</div>
      <div class="peligro"><div><b>Eliminar cuenta</b><span>Borra al usuario de forma permanente.</span></div>
        <button class="btn danger sm" onclick="eliminarUsuario('${id}','${tipo}')">${ic('trash-2')} Eliminar</button></div>
    </div></div></div>`;
  lucide.createIcons();
}
function cerrarModal(){ clearInterval(rutaTimer); $('modal').innerHTML = ''; }

// ===== Ruta del viaje (rastro de seguridad, se guarda 7 días) =====
const conRuta = v => v.estado !== 'SOLICITADO' && ts(v.fecha_hora) > hace(7);
const COLOR_ROL = {conductor:'#2563EB', pasajero:'#16A34A'};
const haceTxt = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'hace segundos' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
const gmaps = (lat, lng) => `https://www.google.com/maps?q=${lat},${lng}`;
let rutaTimer = null;

function verRuta(viajeId){
  const v = viajes.find(x => x.id === viajeId); if (!v) return;
  clearInterval(rutaTimer);
  $('modal').innerHTML = `<div class="backdrop" onclick="if(event.target===this)cerrarModal()"><div class="sheet ruta">
    <div class="sheetHead"><div class="kpiIc" style="background:#DC262614;color:#DC2626">${ic('map-pinned')}</div>
      <div style="min-width:0"><div style="font-size:17px;font-weight:900">${esc(v.origen || 'Origen')} → ${esc(v.destino)}</div>
        <div class="muted">${esc(nombre(pasajeros, v.pasajero_id))} (pasajero) · ${esc(nombre(conductores, v.conductor_id))} (conductor) · ${cuando(v.fecha_hora)}</div></div>
      <button class="x" onclick="cerrarModal()">${ic('x')}</button></div>
    <div id="mapa" class="mapa"></div>
    <div class="sheetBody" id="rutaInfo"><div class="sk" style="height:56px"></div></div></div></div>`;
  lucide.createIcons();
  const mapa = L.map('mapa').setView([-1.84567, -79.96503], 14); // Montalvo
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(mapa);
  const capa = L.layerGroup().addTo(mapa);
  let encuadrado = false;
  const marca = (lat, lng, color) => L.marker([lat, lng], {icon:L.divIcon({className:'', html:`<div class="pulso" style="background:${color};--c:${color}99"></div>`, iconSize:[18, 18]})});
  const linkMaps = (lat, lng) => `<a class="btn soft sm" target="_blank" rel="noopener" href="${gmaps(lat, lng)}">${ic('external-link')} Google Maps</a>`;

  const pintar = async () => {
    const {data, error} = await sb.from('viaje_rastro').select('rol,lat,lng,fecha').eq('viaje_id', viajeId).order('fecha');
    if (!$('mapa')) return clearInterval(rutaTimer);
    if (error) { $('rutaInfo').innerHTML = `<div class="muted">No se pudo cargar el rastro: ${esc(error.message)}</div>`; return; }
    capa.clearLayers();
    const limites = [], filas = [];
    for (const rol of ['conductor', 'pasajero']) {
      const pts = (data || []).filter(x => x.rol === rol), c = COLOR_ROL[rol];
      const titulo = `<b>${rol === 'conductor' ? 'Conductor' : 'Pasajero'}</b> · ${esc(nombre(rol === 'conductor' ? conductores : pasajeros, rol === 'conductor' ? v.conductor_id : v.pasajero_id))}`;
      if (!pts.length) { filas.push(`<div class="rastro"><span class="punto" style="background:#CBD5E1"></span><div>${titulo}<div class="muted">Sin puntos registrados</div></div></div>`); continue; }
      const linea = pts.map(x => [x.lat, x.lng]); limites.push(...linea);
      L.polyline(linea, {color:c, weight:5, opacity:.85, lineJoin:'round'}).addTo(capa);
      L.marker(linea[0], {icon:L.divIcon({className:'', html:`<div class="inicio" style="--c:${c}"></div>`, iconSize:[12, 12]})})
        .bindTooltip(`Inicio (${rol}) · ${cuando(pts[0].fecha)}`).addTo(capa);
      const u = pts[pts.length - 1];
      marca(u.lat, u.lng, c).bindTooltip(`Última posición (${rol}) · ${cuando(u.fecha)}`).addTo(capa);
      filas.push(`<div class="rastro"><span class="punto" style="background:${c}"></span>
        <div>${titulo}<div class="muted">${pts.length} puntos · último ${cuando(u.fecha)} (${haceTxt(ts(u.fecha))})</div></div>${linkMaps(u.lat, u.lng)}</div>`);
    }
    // Sin rastro: usa la última posición guardada en el viaje (versiones anteriores de la app).
    if (!limites.length && v.ultima_lat != null) {
      limites.push([v.ultima_lat, v.ultima_lng]);
      marca(v.ultima_lat, v.ultima_lng, '#DC2626').addTo(capa);
      filas.unshift(`<div class="rastro"><span class="punto" style="background:#DC2626"></span><div><b>Última posición conocida del viaje</b><div class="muted">${cuando(v.ultima_ubicacion_at)}</div></div>${linkMaps(v.ultima_lat, v.ultima_lng)}</div>`);
    }
    if (limites.length && !encuadrado) { mapa.fitBounds(limites, {padding:[40, 40], maxZoom:17}); encuadrado = true; }
    $('rutaInfo').innerHTML = `${v.estado === 'EN CURSO' ? '<span class="vivo">EN VIVO · se actualiza cada 15 s</span>' : ''}${filas.join('')}
      <div class="muted">${ic('shield', 'style="width:14px;height:14px;vertical-align:-2px"')} Solo se registra durante el viaje en curso y se borra automáticamente a los 7 días.</div>`;
    lucide.createIcons();
  };
  pintar();
  if (v.estado === 'EN CURSO') rutaTimer = setInterval(pintar, 15000);
  setTimeout(() => mapa.invalidateSize(), 350); // el modal termina de animarse
}
</script>
</body>
